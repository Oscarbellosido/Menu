<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les meves apps</title>
<meta name="description" content="Llançador de les aplicacions: Notícies, El Temps, Jocs i Economia.">
<meta name="theme-color" content="#0c1626">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // El tema triat s'aplica abans de pintar, perquè no surti un instant el fosc
  try { const t = localStorage.getItem('menu_tema'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  /* Tema: per defecte segueix el del mòbil; el botó del peu el pot forçar (data-theme a <html>) */
  :root {
    color-scheme: dark;
    --bg: #0c1626;
    --bg2: #13213a;
    --card: rgba(255,255,255,.05);
    --card-hover: rgba(255,255,255,.09);
    --line: rgba(255,255,255,.09);
    --text: #e8eef8;
    --text2: #c2cee0;
    --muted: #8fa1bd;
    --lloc: #38bdf8;
    --cap: #7fb0ff;
    --ombra: none;
    --ombra-icona: 0 4px 14px rgba(0,0,0,.35);
    --to-c: 100%;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
    --bg: #eef2f8;
    --bg2: #ffffff;
    --card: #ffffff;
    --card-hover: #f8fafd;
    --line: rgba(15,30,60,.11);
    --text: #0f1b2d;
    --text2: #33435c;
    --muted: #5b6b84;
    --lloc: #0277b6;
    --cap: #1d5fd6;
    --ombra: 0 1px 3px rgba(15,30,60,.08);
    --ombra-icona: 0 2px 8px rgba(15,30,60,.18);
    --to-c: 72%;   /* el color de cada app, enfosquit perquè es llegeixi sobre blanc */
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #eef2f8;
    --bg2: #ffffff;
    --card: #ffffff;
    --card-hover: #f8fafd;
    --line: rgba(15,30,60,.11);
    --text: #0f1b2d;
    --text2: #33435c;
    --muted: #5b6b84;
    --lloc: #0277b6;
    --cap: #1d5fd6;
    --ombra: 0 1px 3px rgba(15,30,60,.08);
    --ombra-icona: 0 2px 8px rgba(15,30,60,.18);
    --to-c: 72%;   /* el color de cada app, enfosquit perquè es llegeixi sobre blanc */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(120% 70% at 50% 0%, var(--bg2), var(--bg) 70%) fixed, var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    padding: max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  main { max-width: 760px; margin: 0 auto; }

  header { margin: 8px 4px 28px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .rellotge { min-width: 0; }

  .temps {
    flex: none; text-align: right; color: inherit; text-decoration: none;
    padding: 6px 10px; margin: -6px -10px 0 0; border-radius: 14px;
    transition: background .15s;
  }
  .temps:hover { background: var(--card); }
  .temps-ara { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  .temps-icona { font-size: clamp(30px, 8vw, 40px); line-height: 1; }
  .temps-graus {
    font-size: clamp(34px, 9.5vw, 48px); font-weight: 600; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums; line-height: 1.05;
  }
  .temps-desc { font-size: 14px; color: var(--text); margin-top: 4px; }
  .temps-minmax { font-size: 13px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .temps-lloc { font-size: 13px; color: var(--lloc); margin-top: 2px; }
  .salutacio { font-size: 15px; color: var(--muted); }
  .hora {
    font-size: clamp(44px, 12vw, 64px); font-weight: 650; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums; line-height: 1.05; margin-top: 4px;
  }
  .data { font-size: 16px; color: var(--muted); margin-top: 6px; }
  .data::first-letter { text-transform: uppercase; }

  /* Titulars del dia (de l'app Notícies) */
  .titulars {
    display: block; margin: 0 0 16px; padding: 14px 16px;
    background: color-mix(in srgb, #3b82f6 9%, transparent);
    border: 1px solid color-mix(in srgb, #3b82f6 28%, transparent);
    border-radius: 20px; color: inherit; text-decoration: none;
    transition: background .15s;
  }
  .titulars:hover { background: color-mix(in srgb, #3b82f6 14%, transparent); }
  .titulars-cap {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--cap);
  }
  .titulars-mes { font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 13px; white-space: nowrap; }
  .titulars ol { list-style: none; margin-top: 8px; }
  .titulars li { padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.4; color: var(--text2); }
  .titulars li:first-child { border-top: 0; padding-top: 2px; font-size: 17px; font-weight: 600; line-height: 1.3; color: var(--text); }
  .titulars .cat { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); margin-bottom: 1px; }

  .apps {
    list-style: none;
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr));
    align-items: start;   /* obrir l'explicació d'una app no estira la del costat */
  }
  .app {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px; box-shadow: var(--ombra);
    position: relative; overflow: hidden;
    transition: background .15s, border-color .15s;
  }
  .app::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 4px;
    background: var(--c); opacity: .9;
  }
  .app:hover { background: var(--card-hover); border-color: color-mix(in srgb, var(--c) 45%, transparent); }
  .app .obre {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 16px 10px;
    color: inherit; text-decoration: none;
    transition: transform .1s;
  }
  .app .obre:active { transform: scale(.98); }
  .app .obre:focus-visible { outline: 2px solid var(--c); outline-offset: -2px; border-radius: 20px; }
  .app img {
    width: 56px; height: 56px; border-radius: 14px; flex: none;
    box-shadow: var(--ombra-icona);
  }
  .app .txt { min-width: 0; flex: 1; }
  .app .nom { font-size: 19px; font-weight: 620; }
  .app .desc { display: block; font-size: 14px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .app .fletxa { color: var(--muted); font-size: 22px; flex: none; transition: transform .15s, color .15s; }
  .app .obre:hover .fletxa { color: var(--c); transform: translateX(3px); }

  /* "Què fa aquesta app?": l'explicació plegada, amb un botó que es veu a totes les targetes */
  .app .info {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 8px 16px 12px 88px;
    font: inherit; font-size: 13px; text-align: left;
    color: color-mix(in srgb, var(--c) var(--to-c), #000); background: none; border: 0; cursor: pointer;
  }
  .app .info .i {
    width: 17px; height: 17px; border-radius: 50%; flex: none;
    display: inline-grid; place-items: center;
    border: 1.5px solid currentColor; font-size: 11px; font-weight: 700; font-style: normal;
  }
  .app .info .plec { transition: transform .2s; }
  .app .info[aria-expanded="true"] .plec { transform: rotate(180deg); }
  .app .info:hover span:not(.i):not(.plec) { text-decoration: underline; }
  .app .detall {
    margin: 0 16px 14px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 14px; line-height: 1.5; color: var(--text2);
  }

  footer { margin-top: 28px; text-align: center; font-size: 13px; color: var(--muted); }
  footer button {
    font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 16px; cursor: pointer;
  }
  .passos {
    max-width: 420px; margin: 12px auto 0; padding: 12px 14px; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    color: var(--text); font-size: 14px; line-height: 1.5;
  }
  .passos b { font-weight: 620; }
  .peu { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding: 0 4px; }
  .peu .tema { font-size: 12px; padding: 6px 12px; color: var(--muted); }
  .signatura {
    font-size: 13px; letter-spacing: .04em; color: var(--muted); opacity: .8;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div class="rellotge">
      <div class="salutacio" id="salutacio">Hola</div>
      <div class="hora" id="hora">--:--</div>
      <div class="data" id="data"></div>
    </div>
    <a class="temps" id="temps" href="https://oscarbellosido.github.io/ElTemps/" hidden>
      <div class="temps-ara"><span class="temps-icona" id="t-icona"></span><span class="temps-graus" id="t-graus"></span></div>
      <div class="temps-desc" id="t-desc"></div>
      <div class="temps-minmax" id="t-minmax"></div>
      <div class="temps-lloc" id="t-lloc"></div>
    </a>
  </header>

  <a class="titulars" id="titulars" href="https://oscarbellosido.github.io/Noticies/INDEX.html" hidden>
    <div class="titulars-cap"><span>Avui al món</span><span class="titulars-mes">Totes les notícies ›</span></div>
    <ol id="titulars-llista"></ol>
  </a>

  <ul class="apps" id="apps"></ul>

  <footer>
    <button id="instal" hidden>Instal·la el menú al mòbil</button>
    <p class="passos" id="passos" hidden></p>
    <div class="peu">
      <button class="tema" id="tema" type="button"></button>
      <p class="signatura">byCRE</p>
    </div>
  </footer>
</main>

<script>
// Per afegir una app: posa'n la icona (192 px) a icones/ i afegeix-la aquí.
// L'ordre d'aquesta llista és l'ordre en què surten a la pantalla.
// desc: una frase curta; detall: què fa el programa, en dues o tres frases.
const APPS = [
  { nom: 'Notícies', url: 'https://oscarbellosido.github.io/Noticies/INDEX.html', icona: 'icones/noticies.png', color: '#3b82f6',
    desc: 'Notícies internacionals resumides en català',
    detall: 'Recull dos cops al dia, a les 6 del matí i a les 4 de la tarda, les notícies de 27 mitjans del món, les tradueix i les resumeix en dues o tres línies. '
          + 'Les ordena per importància i per categoria, agrupa les que parlen del mateix fet i indica la línia editorial de cada mitjà. '
          + 'Comença amb un resum del dia i et pot avisar al mòbil.' },
  { nom: 'El Temps', url: 'https://oscarbellosido.github.io/ElTemps/', icona: 'icones/temps.png', color: '#38bdf8',
    desc: 'Predicció amb el consens de diversos models',
    detall: 'Compara set models meteorològics (europeu, alemany, francès, americà…) i en treu una predicció comuna amb un indicador de fiabilitat. '
          + "Té la previsió per hores i per a set dies, el radar de pluja, la qualitat de l'aire, els avisos oficials i el clima de cada població des del 1940." },
  { nom: 'Jocs', url: 'https://oscarbellosido.github.io/Jocs/', icona: 'icones/jocs.png', color: '#f59e0b',
    desc: 'Disset clàssics dels salons recreatius',
    detall: 'Pong, Space Invaders, Comecocos, Tetris, Donkey Kong, Frogger i fins a disset màquines recreatives dels anys 70 i 80, fidels a les originals. '
          + 'Pensats per jugar-hi al mòbil, amb els rècords de tothom guardats.' },
  { nom: 'Economia', url: 'https://oscarbellosido.github.io/Economia/', icona: 'icones/economia.png', color: '#3987e5',
    desc: "L'economia mundial explicada fàcil",
    detall: "Explica en llenguatge planer el deute, la inflació, els sous, els tipus d'interès, el creixement i l'atur dels principals països. "
          + 'Cada pàgina comença amb la conclusió en 30 segons i té rutes guiades com "Per què tot és més car?" o "Cobraré pensió?". '
          + "Les dades de l'FMI, l'OCDE i els bancs centrals s'actualitzen cada mes." },
];

const llista = document.getElementById('apps');
for (const a of APPS) {
  const li = document.createElement('li');
  li.className = 'app';
  li.style.setProperty('--c', a.color);
  const id = 'detall-' + APPS.indexOf(a);
  li.innerHTML = `
    <a class="obre" href="${a.url}">
      <img src="${a.icona}" alt="" width="56" height="56">
      <span class="txt"><span class="nom"></span><span class="desc"></span></span>
      <span class="fletxa" aria-hidden="true">›</span>
    </a>
    <button class="info" type="button" aria-expanded="false" aria-controls="${id}">
      <i class="i" aria-hidden="true">i</i><span>Què fa aquesta app?</span><span class="plec" aria-hidden="true">▾</span>
    </button>
    <p class="detall" id="${id}" hidden></p>`;
  li.querySelector('.nom').textContent = a.nom;
  li.querySelector('.desc').textContent = a.desc;
  li.querySelector('.detall').textContent = a.detall;
  const boto = li.querySelector('.info'), detall = li.querySelector('.detall');
  boto.addEventListener('click', () => {
    detall.hidden = !detall.hidden;
    boto.setAttribute('aria-expanded', String(!detall.hidden));
    boto.querySelector('span').textContent = detall.hidden ? 'Què fa aquesta app?' : 'Amaga l\'explicació';
  });
  llista.append(li);
}

// Tema clar / fosc: automàtic (el del mòbil) → clar → fosc → automàtic…
const TEMES = { auto: '◐ Tema automàtic', light: '☀️ Tema clar', dark: '🌙 Tema fosc' };
const botoTema = document.getElementById('tema');
function aplicaTema(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = t;
  botoTema.textContent = TEMES[t];
  const clar = t === 'light' || (t === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
  document.querySelector('meta[name="theme-color"]').content = clar ? '#eef2f8' : '#0c1626';
}
let tema = 'auto';
try { tema = localStorage.getItem('menu_tema') || 'auto'; } catch {}
if (!TEMES[tema]) tema = 'auto';
aplicaTema(tema);
botoTema.addEventListener('click', () => {
  const ordre = Object.keys(TEMES);
  tema = ordre[(ordre.indexOf(tema) + 1) % ordre.length];
  try { localStorage.setItem('menu_tema', tema); } catch {}
  aplicaTema(tema);
});
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => aplicaTema(tema));

// Rellotge i salutació
function rellotge() {
  const ara = new Date();
  const h = ara.getHours();
  document.getElementById('salutacio').textContent =
    h < 6 ? 'Bona nit' : h < 14 ? 'Bon dia' : h < 21 ? 'Bona tarda' : 'Bona nit';
  document.getElementById('hora').textContent =
    ara.toLocaleTimeString('ca-ES', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('data').textContent =
    ara.toLocaleDateString('ca-ES', { weekday: 'long', day: 'numeric', month: 'long' });
}
rellotge();
setInterval(rellotge, 1000);

// El temps d'ara, amb les mateixes dades (Open-Meteo) que l'app El Temps.
// Lloc: on és la persona (ubicació del mòbil). Si no dona permís, l'últim lloc consultat a El Temps
// (les dues apps són a oscarbellosido.github.io i comparteixen localStorage); si no n'hi ha cap, Barcelona.
const WMO = {
  0:['☀️','Cel serè'], 1:['🌤️','Majoritàriament serè'], 2:['⛅','Parcialment ennuvolat'], 3:['☁️','Ennuvolat'],
  45:['🌫️','Boira'], 48:['🌫️','Boira amb gebre'],
  51:['🌦️','Plugim feble'], 53:['🌦️','Plugim'], 55:['🌧️','Plugim intens'],
  56:['🌧️','Plugim gelant feble'], 57:['🌧️','Plugim gelant'],
  61:['🌧️','Pluja feble'], 63:['🌧️','Pluja'], 65:['🌧️','Pluja forta'],
  66:['🌨️','Pluja gelant feble'], 67:['🌨️','Pluja gelant forta'],
  71:['🌨️','Nevada feble'], 73:['🌨️','Nevada'], 75:['❄️','Nevada forta'],
  77:['🌨️','Calamarsa fina'],
  80:['🌦️','Ruixats febles'], 81:['🌧️','Ruixats'], 82:['⛈️','Ruixats forts'],
  85:['🌨️','Ruixats de neu febles'], 86:['❄️','Ruixats de neu forts'],
  95:['⛈️','Tempesta'], 96:['⛈️','Tempesta amb calamarsa'], 99:['⛈️','Tempesta forta amb calamarsa'],
};
const wmo = c => WMO[c] || ['🌡️', '—'];
const wmoIcona = (c, esDia) => esDia ? wmo(c)[0] : (c <= 1 ? '🌙' : c === 2 ? '☁️' : wmo(c)[0]);
const CACHE_TEMPS = 'menu_temps';
const LLOC_GPS = 'menu_lloc';   // últim lloc trobat amb la ubicació, amb el nom ja buscat
const PROXY = u => `https://mecai.oscarbellosido.workers.dev/?action=rss&url=${encodeURIComponent(u)}`;
const llegeix = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
const desa = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const arrodoneix = n => Math.round(n * 1000) / 1000;   // ~100 m: no cal més precisió (ni enviar-ne més)
const km = (a, b) => Math.hypot(a.lat - b.lat, (a.lon - b.lon) * Math.cos(a.lat * Math.PI / 180)) * 111;

function llocDeReserva() {
  const r = (llegeix('eltemps_recent') || [])[0];
  if (r && isFinite(r.lat) && isFinite(r.lon)) return { name: r.name, lat: r.lat, lon: r.lon };
  return { name: 'Barcelona', lat: 41.3888, lon: 2.1590 };
}

function posicio() {
  return new Promise((ok, ko) => {
    if (!navigator.geolocation) return ko();
    navigator.geolocation.getCurrentPosition(
      p => ok({ lat: arrodoneix(p.coords.latitude), lon: arrodoneix(p.coords.longitude) }),
      ko, { timeout: 10000, maximumAge: 10 * 60 * 1000 });
  });
}

async function nomDelLloc({ lat, lon }) {
  // El mateix que fa El Temps: Nominatim (OpenStreetMap) a través del proxy mecai
  const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=10&accept-language=ca`;
  const r = await fetch(PROXY(url), { signal: AbortSignal.timeout(8000) });
  if (!r.ok) throw new Error('nom');
  const j = await r.json(), a = j.address || {};
  return a.city || a.town || a.village || a.municipality || j.name;
}

async function llocActual() {
  try {
    const p = await posicio();
    const anterior = llegeix(LLOC_GPS);
    // Si no t'has mogut més d'un parell de km, es reaprofita el nom i no es torna a buscar
    if (anterior && km(anterior, p) < 2) return { ...anterior, lat: p.lat, lon: p.lon };
    let name = 'Aquí';
    try { name = await nomDelLloc(p) || name; } catch {}
    const lloc = { name, lat: p.lat, lon: p.lon, gps: true };
    if (name !== 'Aquí') desa(LLOC_GPS, lloc);
    return lloc;
  } catch {
    return llocDeReserva();   // sense permís o sense GPS
  }
}

function pintaTemps({ lloc, d }) {
  const c = d.current, dia = d.daily;
  document.getElementById('t-icona').textContent = wmoIcona(c.weather_code, c.is_day);
  document.getElementById('t-graus').textContent = Math.round(c.temperature_2m) + '°';
  document.getElementById('t-desc').textContent = wmo(c.weather_code)[1];
  let mm = `↑${Math.round(dia.temperature_2m_max[0])}° ↓${Math.round(dia.temperature_2m_min[0])}°`;
  const pluja = dia.precipitation_probability_max?.[0];
  if (pluja >= 20) mm += ` · 💧${pluja}%`;
  document.getElementById('t-minmax').textContent = mm;
  document.getElementById('t-lloc').textContent = (lloc.gps ? '📍 ' : '') + lloc.name;
  const a = document.getElementById('temps');
  a.href = 'https://oscarbellosido.github.io/ElTemps/?' +
    new URLSearchParams({ lat: lloc.lat, lon: lloc.lon, name: lloc.name });
  a.title = `El temps a ${lloc.name} — obre El Temps`;
  a.hidden = false;
}

async function carregaTemps() {
  // Mentre es busca la ubicació, es mostra el darrer temps desat perquè no surti buit
  const desat = llegeix(CACHE_TEMPS);
  if (desat && document.getElementById('temps').hidden) pintaTemps(desat);
  const lloc = await llocActual();
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lloc.lat}&longitude=${lloc.lon}`
      + `&current=temperature_2m,weather_code,is_day`
      + `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max`
      + `&timezone=auto&forecast_days=1`;
    const r = await fetch(url, { signal: AbortSignal.timeout(10000) });
    if (!r.ok) throw new Error('temps');
    const dades = { lloc, d: await r.json() };
    pintaTemps(dades);
    desa(CACHE_TEMPS, dades);
  } catch {} // sense connexió: es queda el que hi havia desat (o res)
}
carregaTemps();
setInterval(carregaTemps, 15 * 60 * 1000);
addEventListener('visibilitychange', () => { if (!document.hidden) carregaTemps(); });

// Titulars del dia: les notícies més rellevants de les últimes 24 h de l'app Notícies (una per tema)
const CACHE_TITULARS = 'menu_titulars';
let darrersTitulars = 0;

function pintaTitulars(llista) {
  const ol = document.getElementById('titulars-llista');
  ol.replaceChildren(...llista.map(t => {
    const li = document.createElement('li');
    const cat = document.createElement('span');
    cat.className = 'cat';
    cat.textContent = t.categoria;
    li.append(cat, t.titol);
    return li;
  }));
  document.getElementById('titulars').hidden = !llista.length;
}

async function carregaTitulars() {
  if (Date.now() - darrersTitulars < 10 * 60 * 1000) return;   // com a molt cada 10 minuts
  darrersTitulars = Date.now();
  const desat = llegeix(CACHE_TITULARS);
  if (desat && document.getElementById('titulars').hidden) pintaTitulars(desat);
  try {
    const r = await fetch('https://noticies.oscarbellosido.workers.dev/?action=news&limit=150',
      { signal: AbortSignal.timeout(10000) });
    if (!r.ok) throw new Error('noticies');
    const { articles = [] } = await r.json();
    const temes = new Set(), tria = [];
    articles
      .filter(a => !a.is_duplicate && a.title_ca && Date.now() - new Date(a.published_at) < 24 * 3600 * 1000)
      .sort((a, b) => b.relevance - a.relevance || new Date(b.published_at) - new Date(a.published_at))
      .forEach(a => {
        const tema = a.topic_id || a.id;
        if (tria.length < 3 && !temes.has(tema)) { temes.add(tema); tria.push({ titol: a.title_ca, categoria: a.category }); }
      });
    pintaTitulars(tria);
    desa(CACHE_TITULARS, tria);
  } catch {} // sense connexió: es queden els darrers desats
}
carregaTitulars();
addEventListener('visibilitychange', () => { if (!document.hidden) carregaTitulars(); });

// PWA: funciona sense connexió i es pot instal·lar
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js');
}
let peticio;
const boto = document.getElementById('instal');
const passos = document.getElementById('passos');
addEventListener('beforeinstallprompt', e => { e.preventDefault(); peticio = e; boto.hidden = false; });
addEventListener('appinstalled', () => { boto.hidden = true; });

// Apple no deixa que la pàgina obri la instal·lació (no hi ha beforeinstallprompt):
// a l'iPhone/iPad i al Safari del Mac el botó explica com fer-ho des del menú del navegador.
const ua = navigator.userAgent;
const jaInstallada = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const esIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
const esSafariMac = !esIOS && /Macintosh/.test(ua) && /Safari\//.test(ua) && !/Chrome|Chromium|CriOS|Edg|OPR|Firefox/.test(ua);
if (!jaInstallada && (esIOS || esSafariMac)) {
  boto.textContent = esIOS ? 'Instal·la el menú a l\'iPhone' : 'Instal·la el menú al Mac';
  passos.innerHTML = esIOS
    ? 'Toca el botó <b>Compartir</b> (el quadrat amb la fletxa cap amunt, a la barra del Safari) '
      + 'i tria <b>Afegeix a la pantalla d\'inici</b>. Després toca <b>Afegeix</b>.'
    : 'Al menú <b>Arxiu</b> del Safari, tria <b>Afegeix al Dock…</b> i després <b>Afegeix</b>. '
      + '(Cal macOS Sonoma o posterior.)';
  boto.hidden = false;
}

boto.addEventListener('click', () => {
  if (peticio) { boto.hidden = true; peticio.prompt(); peticio = null; }
  else passos.hidden = !passos.hidden;
});
</script>
