<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les meves apps</title>
<meta name="description" content="Llançador de les aplicacions: Notícies, El Temps, Jocs i Economia.">
<meta name="theme-color" content="#0c1626">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #0c1626;
    --bg2: #13213a;
    --card: rgba(255,255,255,.05);
    --card-hover: rgba(255,255,255,.09);
    --line: rgba(255,255,255,.09);
    --text: #e8eef8;
    --muted: #8fa1bd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(120% 70% at 50% 0%, var(--bg2), var(--bg) 70%) fixed, var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    padding: max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  main { max-width: 760px; margin: 0 auto; }

  header { margin: 8px 4px 28px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .rellotge { min-width: 0; }

  .temps {
    flex: none; text-align: right; color: inherit; text-decoration: none;
    padding: 6px 10px; margin: -6px -10px 0 0; border-radius: 14px;
    transition: background .15s;
  }
  .temps:hover { background: var(--card); }
  .temps-ara { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  .temps-icona { font-size: clamp(30px, 8vw, 40px); line-height: 1; }
  .temps-graus {
    font-size: clamp(34px, 9.5vw, 48px); font-weight: 600; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums; line-height: 1.05;
  }
  .temps-desc { font-size: 14px; color: var(--text); margin-top: 4px; }
  .temps-minmax { font-size: 13px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .temps-lloc { font-size: 13px; color: #38bdf8; margin-top: 2px; }
  .salutacio { font-size: 15px; color: var(--muted); }
  .hora {
    font-size: clamp(44px, 12vw, 64px); font-weight: 650; letter-spacing: -.03em;
    font-variant-numeric: tabular-nums; line-height: 1.05; margin-top: 4px;
  }
  .data { font-size: 16px; color: var(--muted); margin-top: 6px; }
  .data::first-letter { text-transform: uppercase; }

  .apps {
    list-style: none;
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr));
  }
  .app { display: flex; }
  .app a {
    flex: 1;
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0 16px;
    padding: 16px; min-height: 92px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    color: inherit; text-decoration: none;
    position: relative; overflow: hidden;
    transition: background .15s, transform .1s, border-color .15s;
  }
  .app a::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 4px;
    background: var(--c); opacity: .9;
  }
  .app a:hover { background: var(--card-hover); border-color: color-mix(in srgb, var(--c) 45%, transparent); }
  .app a:active { transform: scale(.98); }
  .app a:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
  .app img {
    width: 60px; height: 60px; border-radius: 15px; flex: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  .app .txt { min-width: 0; flex: 1; }
  .app .nom { font-size: 19px; font-weight: 620; }
  .app .desc { font-size: 14px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .app .fletxa { color: var(--muted); font-size: 22px; flex: none; transition: transform .15s, color .15s; }
  .app .detall {
    grid-column: 1 / -1;
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 14px; line-height: 1.5; color: #b9c6da;
  }
  .app a:hover .fletxa { color: var(--c); transform: translateX(3px); }

  footer { margin-top: 28px; text-align: center; font-size: 13px; color: var(--muted); }
  footer button {
    font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 16px; cursor: pointer;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div class="rellotge">
      <div class="salutacio" id="salutacio">Hola</div>
      <div class="hora" id="hora">--:--</div>
      <div class="data" id="data"></div>
    </div>
    <a class="temps" id="temps" href="https://oscarbellosido.github.io/ElTemps/" hidden>
      <div class="temps-ara"><span class="temps-icona" id="t-icona"></span><span class="temps-graus" id="t-graus"></span></div>
      <div class="temps-desc" id="t-desc"></div>
      <div class="temps-minmax" id="t-minmax"></div>
      <div class="temps-lloc" id="t-lloc"></div>
    </a>
  </header>

  <ul class="apps" id="apps"></ul>

  <footer>
    <button id="instal" hidden>Instal·la el menú al mòbil</button>
  </footer>
</main>

<script>
// Per afegir una app: posa'n la icona (192 px) a icones/ i afegeix-la aquí.
// L'ordre d'aquesta llista és l'ordre en què surten a la pantalla.
// desc: una frase curta; detall: què fa el programa, en dues o tres frases.
const APPS = [
  { nom: 'Notícies', url: 'https://oscarbellosido.github.io/Noticies/INDEX.html', icona: 'icones/noticies.png', color: '#3b82f6',
    desc: 'Notícies internacionals resumides en català',
    detall: 'Recull dos cops al dia, a les 6 del matí i a les 4 de la tarda, les notícies de 27 mitjans del món, les tradueix i les resumeix en dues o tres línies. '
          + 'Les ordena per importància i per categoria, agrupa les que parlen del mateix fet i indica la línia editorial de cada mitjà. '
          + 'Comença amb un resum del dia i et pot avisar al mòbil.' },
  { nom: 'El Temps', url: 'https://oscarbellosido.github.io/ElTemps/', icona: 'icones/temps.png', color: '#38bdf8',
    desc: 'Predicció amb el consens de diversos models',
    detall: 'Compara set models meteorològics (europeu, alemany, francès, americà…) i en treu una predicció comuna amb un indicador de fiabilitat. '
          + "Té la previsió per hores i per a set dies, el radar de pluja, la qualitat de l'aire, els avisos oficials i el clima de cada població des del 1940." },
  { nom: 'Jocs', url: 'https://oscarbellosido.github.io/Jocs/', icona: 'icones/jocs.png', color: '#f59e0b',
    desc: 'Disset clàssics dels salons recreatius',
    detall: 'Pong, Space Invaders, Comecocos, Tetris, Donkey Kong, Frogger i fins a disset màquines recreatives dels anys 70 i 80, fidels a les originals. '
          + 'Pensats per jugar-hi al mòbil, amb els rècords de tothom guardats.' },
  { nom: 'Economia', url: 'https://oscarbellosido.github.io/Economia/', icona: 'icones/economia.png', color: '#3987e5',
    desc: "L'economia mundial explicada fàcil",
    detall: "Explica en llenguatge planer el deute, la inflació, els sous, els tipus d'interès, el creixement i l'atur dels principals països. "
          + 'Cada pàgina comença amb la conclusió en 30 segons i té rutes guiades com "Per què tot és més car?" o "Cobraré pensió?". '
          + "Les dades de l'FMI, l'OCDE i els bancs centrals s'actualitzen cada mes." },
];

const llista = document.getElementById('apps');
for (const a of APPS) {
  const li = document.createElement('li');
  li.className = 'app';
  li.innerHTML = `
    <a href="${a.url}" style="--c:${a.color}">
      <img src="${a.icona}" alt="" width="60" height="60">
      <span class="txt"><span class="nom"></span><span class="desc" style="display:block"></span></span>
      <span class="fletxa" aria-hidden="true">›</span>
      <span class="detall"></span>
    </a>`;
  li.querySelector('.nom').textContent = a.nom;
  li.querySelector('.desc').textContent = a.desc;
  li.querySelector('.detall').textContent = a.detall;
  llista.append(li);
}

// Rellotge i salutació
function rellotge() {
  const ara = new Date();
  const h = ara.getHours();
  document.getElementById('salutacio').textContent =
    h < 6 ? 'Bona nit' : h < 14 ? 'Bon dia' : h < 21 ? 'Bona tarda' : 'Bona nit';
  document.getElementById('hora').textContent =
    ara.toLocaleTimeString('ca-ES', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('data').textContent =
    ara.toLocaleDateString('ca-ES', { weekday: 'long', day: 'numeric', month: 'long' });
}
rellotge();
setInterval(rellotge, 1000);

// El temps d'ara, del mateix lloc i amb les mateixes dades (Open-Meteo) que l'app El Temps.
// Com que les dues apps són a oscarbellosido.github.io, es pot llegir l'últim lloc consultat a El Temps;
// si no n'hi ha cap, Barcelona (el mateix que fa El Temps).
const WMO = {
  0:['☀️','Cel serè'], 1:['🌤️','Majoritàriament serè'], 2:['⛅','Parcialment ennuvolat'], 3:['☁️','Ennuvolat'],
  45:['🌫️','Boira'], 48:['🌫️','Boira amb gebre'],
  51:['🌦️','Plugim feble'], 53:['🌦️','Plugim'], 55:['🌧️','Plugim intens'],
  56:['🌧️','Plugim gelant feble'], 57:['🌧️','Plugim gelant'],
  61:['🌧️','Pluja feble'], 63:['🌧️','Pluja'], 65:['🌧️','Pluja forta'],
  66:['🌨️','Pluja gelant feble'], 67:['🌨️','Pluja gelant forta'],
  71:['🌨️','Nevada feble'], 73:['🌨️','Nevada'], 75:['❄️','Nevada forta'],
  77:['🌨️','Calamarsa fina'],
  80:['🌦️','Ruixats febles'], 81:['🌧️','Ruixats'], 82:['⛈️','Ruixats forts'],
  85:['🌨️','Ruixats de neu febles'], 86:['❄️','Ruixats de neu forts'],
  95:['⛈️','Tempesta'], 96:['⛈️','Tempesta amb calamarsa'], 99:['⛈️','Tempesta forta amb calamarsa'],
};
const wmo = c => WMO[c] || ['🌡️', '—'];
const wmoIcona = (c, esDia) => esDia ? wmo(c)[0] : (c <= 1 ? '🌙' : c === 2 ? '☁️' : wmo(c)[0]);
const CACHE_TEMPS = 'menu_temps';

function llocTemps() {
  try {
    const r = JSON.parse(localStorage.getItem('eltemps_recent') || '[]')[0];
    if (r && isFinite(r.lat) && isFinite(r.lon)) return { name: r.name, lat: r.lat, lon: r.lon };
  } catch {}
  return { name: 'Barcelona', lat: 41.3888, lon: 2.1590 };
}

function pintaTemps({ lloc, d }) {
  const c = d.current, dia = d.daily;
  document.getElementById('t-icona').textContent = wmoIcona(c.weather_code, c.is_day);
  document.getElementById('t-graus').textContent = Math.round(c.temperature_2m) + '°';
  document.getElementById('t-desc').textContent = wmo(c.weather_code)[1];
  let mm = `↑${Math.round(dia.temperature_2m_max[0])}° ↓${Math.round(dia.temperature_2m_min[0])}°`;
  const pluja = dia.precipitation_probability_max?.[0];
  if (pluja >= 20) mm += ` · 💧${pluja}%`;
  document.getElementById('t-minmax').textContent = mm;
  document.getElementById('t-lloc').textContent = '📍 ' + lloc.name;
  const a = document.getElementById('temps');
  a.href = 'https://oscarbellosido.github.io/ElTemps/?' +
    new URLSearchParams({ lat: lloc.lat, lon: lloc.lon, name: lloc.name });
  a.title = `El temps a ${lloc.name} — obre El Temps`;
  a.hidden = false;
}

async function carregaTemps() {
  const lloc = llocTemps();
  try {
    const desat = JSON.parse(localStorage.getItem(CACHE_TEMPS) || 'null');
    if (desat && desat.lloc.lat === lloc.lat && desat.lloc.lon === lloc.lon) pintaTemps(desat);
  } catch {}
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lloc.lat}&longitude=${lloc.lon}`
      + `&current=temperature_2m,weather_code,is_day`
      + `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max`
      + `&timezone=auto&forecast_days=1`;
    const r = await fetch(url, { signal: AbortSignal.timeout(10000) });
    if (!r.ok) throw new Error('temps');
    const dades = { lloc, d: await r.json() };
    pintaTemps(dades);
    try { localStorage.setItem(CACHE_TEMPS, JSON.stringify(dades)); } catch {}
  } catch {} // sense connexió: es queda el que hi havia desat (o res)
}
carregaTemps();
setInterval(carregaTemps, 15 * 60 * 1000);
addEventListener('visibilitychange', () => { if (!document.hidden) carregaTemps(); });

// PWA: funciona sense connexió i es pot instal·lar
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js');
}
let peticio;
const boto = document.getElementById('instal');
addEventListener('beforeinstallprompt', e => { e.preventDefault(); peticio = e; boto.hidden = false; });
boto.addEventListener('click', async () => { boto.hidden = true; peticio.prompt(); peticio = null; });
addEventListener('appinstalled', () => { boto.hidden = true; });
</script>
</body>
</html>
